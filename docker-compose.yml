services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sapper
      POSTGRES_PASSWORD: sapper
      POSTGRES_DB: sapper
    ports:
      - "5433:5432"
    volumes:
      - sapper_pg:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapper -d sapper"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: postgresql://sapper:sapper@db:5432/sapper
      CORS_ORIGINS: "*"
    volumes:
      - ./index.html:/app/index.html
      - ./styles.css:/app/styles.css
      - ./game.js:/app/game.js
      - ./config.js:/app/config.js
      - ./favicon.svg:/app/favicon.svg
    depends_on:
      db:
        condition: service_healthy

volumes:
  sapper_pg:
