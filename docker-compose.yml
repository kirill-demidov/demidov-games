services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sapper
      POSTGRES_PASSWORD: sapper
      POSTGRES_DB: sapper
    ports:
      - "5433:5432"
    volumes:
      - sapper_pg:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapper -d sapper"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: postgresql://sapper:sapper@db:5432/sapper
      CORS_ORIGINS: "https://demidov-games.com,https://www.demidov-games.com,http://localhost:8090,http://127.0.0.1:8090"
    volumes:
      - ./index.html:/app/index.html
      - ./portal.css:/app/portal.css
      - ./favicon.svg:/app/favicon.svg
      - ./mines:/app/mines
      - ./pentix:/app/pentix
      - ./lines:/app/lines
      - ./prince:/app/prince
      - ./arkanoid:/app/arkanoid
      - ./alleycat:/app/alleycat
    depends_on:
      db:
        condition: service_healthy

volumes:
  sapper_pg:
