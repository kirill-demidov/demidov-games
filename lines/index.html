<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Линии 98 — Demidov Games</title>
  <meta name="description" content="Цветные линии: поле 9×9, пять шариков в ряд, ход по свободному пути." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="home" href="/">← Demidov Games</a>
  <div class="desk">
    <div class="win">
      <div class="titlebar">
        <span>Цветные линии</span>
        <a class="x" href="/" aria-label="На портал">×</a>
      </div>
      <div class="work">
        <div class="board" id="board" role="grid" aria-label="Поле 9 на 9"></div>
        <aside class="side">
          <div class="lcd">
            <span>Счёт</span>
            <b id="score">0</b>
          </div>
          <div class="lcd">
            <span>Рекорд</span>
            <b id="best">0</b>
          </div>
          <div class="next-box">
            <span>Следующие</span>
            <div id="next" class="next"></div>
          </div>
          <button type="button" id="newGame">Новая игра</button>
          <p class="help">Пять и больше одного цвета — в ряд по горизонтали, вертикали или диагонали. Шарик едет только по свободным клеткам.</p>
        </aside>
      </div>
    </div>
  </div>
  <p class="toast" id="toast" hidden>Нет пути</p>
  <script src="game.js"></script>
</body>
</html>
