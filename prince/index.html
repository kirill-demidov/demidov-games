<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Prince — Demidov Games</title>
  <meta name="description" content="Платформер в духе классического Prince of Persia: бег, прыжки, ловушки и меч." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="home" href="/">← Demidov Games</a>
  <header class="hud">
    <div id="hp"></div>
    <div id="time">15:00</div>
    <div id="room">зал 1</div>
  </header>
  <canvas id="view" width="640" height="384"></canvas>
  <p class="hint">← → бег · ↑ прыжок / встать · ↓ присесть · пробел меч · R заново</p>
  <div class="pad">
    <button type="button" data-k="left">◀</button>
    <button type="button" data-k="up">▲</button>
    <button type="button" data-k="down">▼</button>
    <button type="button" data-k="right">▶</button>
    <button type="button" data-k="space">⚔</button>
  </div>
  <div class="msg" id="msg">
    <h1>PRINCE</h1>
    <p>Сбежи из дворца. Не торопись на шипах. Меч — только вплотную.</p>
    <button type="button" id="go">Начать</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
