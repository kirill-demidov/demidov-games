<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pentix — Demidov Games</title>
  <meta name="description" content="Тетрис из пентамино: 18 пятиклеточных фигур плюс мелкие. DOS-эстетика, уровни 0–9." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="home" href="/">← Demidov Games</a>

  <section class="screen" id="boot">
    <h1>PENTIX</h1>
    <p class="sub">1986-style · pentomino well</p>
    <p class="hint">18 фигур из пяти клеток, плюс тетрамино и мелочь.<br/>Стрелки / WASD · пробел — бросок · P — пауза</p>
    <label class="lvl">уровень
      <select id="startLevel">
        <option>0</option><option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option><option>7</option>
        <option>8</option><option>9</option>
      </select>
    </label>
    <button class="go" id="startBtn" type="button">START</button>
  </section>

  <section class="play" id="play" hidden>
    <div class="well-wrap">
      <canvas id="well" width="240" height="400"></canvas>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <aside class="hud">
      <div class="box">
        <div class="k">SCORE</div>
        <div class="v" id="score">0</div>
      </div>
      <div class="box">
        <div class="k">BEST</div>
        <div class="v" id="best">0</div>
      </div>
      <div class="box">
        <div class="k">LINES</div>
        <div class="v" id="lines">0</div>
      </div>
      <div class="box">
        <div class="k">LEVEL</div>
        <div class="v" id="level">0</div>
      </div>
      <div class="box next">
        <div class="k">NEXT</div>
        <canvas id="next" width="80" height="80"></canvas>
      </div>
      <button class="go small" id="again" type="button">NEW</button>
    </aside>
  </section>

  <div class="pad" id="pad">
    <button type="button" data-act="left">◀</button>
    <button type="button" data-act="rot">↻</button>
    <button type="button" data-act="right">▶</button>
    <button type="button" data-act="down">▼</button>
    <button type="button" data-act="drop">⬇</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
